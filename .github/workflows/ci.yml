name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes cost Actions minutes and test nothing (2026-10-15).
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

# A newer push supersedes a running one; no point finishing the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adjuster_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/adjuster_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:4900
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the two CP-01 tags below; a shallow clone has neither
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run rules:lint
      # CP-01 (D65, task 4.8): the second product landed between these two tags as rule data, fixtures, the oracle, the seed and tests.
      # Nothing under src/ or prisma/ moved, and this keeps the claim checkable: a moved or missing tag fails here too.
      - run: git diff --exit-code cp-01-base cp-01-done -- src/ prisma/
      - run: npm run fixtures:check # task 1.5: fails if a fixture changed without being committed on purpose
      - run: createdb adjuster_test
      - run: npx prisma migrate deploy
      - run: npx vitest run
      # Tasks 1.12 and 2.11: the gate. Seed 19 claims through the pipeline and the services (3.12: a sign-off, a no-response life, a paid supplemental) under both plan and both ops versions, then replay every stored decision; any divergence exits 1.
      - run: npm run seed:decisions:test
      - run: npm run decisions:verify:test
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
